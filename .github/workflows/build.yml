name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o godmace-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build
        working-directory: godmace-mod
      - uses: actions/upload-artifact@v4
        with:
          name: godmace-jar
          path: |
            godmace-mod/build/libs/*.jar
            !godmace-mod/build/libs/*-sources.jar
